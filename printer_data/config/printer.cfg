[quad_gantry_level]
gantry_corners:
   -60,-10
   360,370
points:
   10,10
   10,330
   330,330
   330,10
speed: 350
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.025
max_adjust: 20

[bed_mesh]
speed: 75
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 340, 340
probe_count: 15, 15
algorithm: bicubic

# BED
[heater_bed]
heater_pin: PF6
sensor_pin: PB0
sensor_type: ATC Semitec 104GT-2
#control: watermark
min_temp: 0
max_temp: 115

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 115

