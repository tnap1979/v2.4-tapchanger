# This file contains common pin mappings for the BIGTREETECH EBBCan
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu et0]
canbus_uuid: 37f6f949587d

[extruder]
step_pin: et0:PD0
dir_pin: !et0:PD1
enable_pin: !et0:PD2
microsteps: 16
rotation_distance: 22.67895 # 22.67895
gear_ratio: 50:10
full_steps_per_rotation: 200 #1.8deg Motor
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
max_extrude_cross_section: 50
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: et0:PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: et0:PA3
control: pid
pid_Kp: 35.055
pid_Ki: 4.173
pid_Kd: 73.614
min_temp: -10
max_temp: 350
min_extrude_temp: 180
pressure_advance: 0.035
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: et0:PA15
interpolate: false
run_current: 0.60
hold_current: 0.1
sense_resistor: 0.110
driver_TPOWERDOWN: 20
#stealthchop_threshold: 999999

[temperature_sensor ToolHead1]
sensor_type: temperature_mcu
sensor_mcu: et0
min_temp: 10
max_temp: 100

[fan_generic T0_partfan]
pin: et0:PA0
kick_start_time: 0.25
cycle_time: 0.15

[heater_fan T0_hotend_fan]
pin: et0:PA1
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

[adxl345]
 cs_pin: et0:PB12
 spi_software_sclk_pin: et0:PB10
 spi_software_mosi_pin: et0:PB11
 spi_software_miso_pin: et0:PB2
 axes_map: x,z,y

[resonance_tester]
accel_chip: adxl345
probe_points:
    175,175,20 

[gcode_macro T0]
variable_active: 0 # Must be zero
variable_color: ""
gcode:
  SELECT_TOOL T=0

[tool T0]
tool_number: 0
extruder: extruder
fan: T0_partfan
# tool_probe: tool_probe T0
# Removed detection_pin: ^et0:PB8 because it conflicts with the Tap probe pin
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
# Position with the toolhead aligned with the dock
params_park_x: 7.0
params_park_y: -1.50
params_park_z: 350.0

[tool_probe T0]
pin: ^et0:PB6
tool: 0
x_offset: 0 # X axis-sensor relative nozzle offset
y_offset: 0 # Y axis-sensor relative nozzle offset
# More positive = More Squish
z_offset: -0.88 # TEXTURED PLATE
#z_offset = -1.290 #-1.390 # SMOOTH PLATE
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder